name: pipeline_tcc
version: "1.0.0"
config-version: 2

profile: pipeline_tcc

model-paths: ["models"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  pipeline_tcc:
    staging:
      +materialized: view
      +schema: bronze
    intermediate:
      +materialized: view
      +schema: prata
    prata:
      +materialized: table
      +schema: prata
    ouro:
      +materialized: table
      +schema: ouro
