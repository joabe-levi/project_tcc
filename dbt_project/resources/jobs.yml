resources:
  jobs:
    pipeline_tcc_medallion:
      name: pipeline_tcc_medallion

      trigger:
        file_arrival:
          url: /Volumes/pipeline_tcc/ingestao/formularios_json/
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 60

      tasks:
        - task_key: ingest_bronze
          environment_key: default
          spark_python_task:
            python_file: ../src/ingest_bronze.py

        - task_key: dbt_build
          depends_on:
            - task_key: ingest_bronze
          environment_key: dbt_env
          dbt_task:
            project_directory: ../dbt
            warehouse_id: 5937853489eb21c0
            catalog: pipeline_tcc
            schema: bronze
            commands:
              - dbt deps
              - dbt build

      environments:
        - environment_key: default
          spec:
            client: "3"
            dependencies:
              - delta-spark
        - environment_key: dbt_env
          spec:
            client: "3"
            dependencies:
              - dbt-databricks>=1.8.0
